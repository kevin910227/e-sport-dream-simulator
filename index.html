/* ===================== 種子亂數 ===================== */
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function(){
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seedStr){
  const seedFn = hashSeed(seedStr);
  const rng = mulberry32(seedFn());
  return rng;
}
function rInt(rng,min,max){ return Math.floor(rng()*(max-min+1))+min; }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function genRandomSeed(){
  const chars='abcdefghjkmnpqrstuvwxyz23456789';
  let s=''; for(let i=0;i<8;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function fullStatKeys(){

function rollArchetypeBase(){

// 每個英雄的熟練度上限：一般英雄 5 點，「絕活」英雄 7 點

// 熟練度加權表（非線性）：一般英雄 1~5 級，絕活英雄 1~7 級
const PROF_WEIGHT_NORMAL = {0:1, 1:1.1, 2:1.2, 3:1.2, 4:1.4, 5:1.5};
const PROF_WEIGHT_SPECIALIST = {0:1, 1:1.1, 2:1.3, 3:1.4, 4:1.5, 5:1.7, 6:1.8, 7:2.0};
// 單一英雄的戰力指數（不對外顯示，但直接影響世界排名）：定位素質 x 熟練度加權表
function heroPowerIndex(heroName){
  const role = HERO_ROLE[heroName] || '絕活';
  const archVal = (S.stats && S.stats[role]!==undefined) ? S.stats[role] : 25;
  const prof = (S.proficiency && S.proficiency[heroName]) || 0;
  const table = role==='絕活' ? PROF_WEIGHT_SPECIALIST : PROF_WEIGHT_NORMAL;
  const profFactor = table[prof] !== undefined ? table[prof] : table[Object.keys(table).length-1];
  return Math.round(archVal * profFactor);
}
// 玩家目前位置最強英雄的戰力倍率，用來影響世界排名的整體評分
function bestHeroPowerFactor(){
  const heroes = S.unlocked[S.position]||[];
  if(!heroes.length) return 1;
  const powers = heroes.map(h=>heroPowerIndex(h));
  const best = Math.max(...powers);
  return 0.85 + best/200;
}

function styleWeight(key){
  const s = S.playStyle;
  const isSupport = S.position==='support';
  if(s==='conservative'){
    if(key==='farm') return 1.3;
    if(key==='vision') return 1.3;
    if(key==='fifth') return isSupport ? 1.5 : 1.3;
    if(key==='comm') return isSupport ? 1.5 : 1.3;
    return 1;
  }
  if(s==='balanced'){
    if(['comm','farm','mechanic','vision','fifth'].includes(key)) return 1.2;
    return 1;
  }
  if(s==='aggressive'){
    if(key==='mechanic') return 1.5;
    if(key==='comm') return 0.8;
    return 1;
  }
  return 1;
}

/* ===================== 工具 ===================== */
function statLabel(key){
  if(key==='farm') return POS[S.position].fourth;
  if(key==='mechanic') return S.position==='support' ? '開團' : '操作';
  if(key==='fifth') return S.position==='support' ? '助攻' : '經濟';
  return STAT_LABEL[key] || key;
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function applyStatDelta(obj){
  for(const k in obj){
    if(k in S.stats || (S.position && fullStatKeys().includes(k))){
      S.stats[k] = clamp((S.stats[k]||0) + obj[k], 0, 99);
    } else if(k in S.hidden){
      S.hidden[k] = clamp(S.hidden[k] + obj[k], 0, 100);
    } else if(k==='profBonus'){
      addProfPoints(obj[k]);
    }
  }
}
function chip(text, positive){
  return '<span class="effectchip '+(positive?'pos':'neg')+'">'+text+'</span>';
}
function effectsToChips(effects){
  let out='';
  for(const k in effects){
    const v=effects[k];
    if(v===0) continue;
    let label = k.startsWith('熟練度：') ? k : ((k==='profBonus') ? '英雄熟練度' : (k in S.hidden ? hiddenLabel(k) : statLabel(k)));
    const positiveIsGood = (k==='explosionRate') ? v<0 : v>0;
    out += chip(label+(v>0?' +'+v:' '+v), positiveIsGood);
  }
  return out || '<span class="muted" style="font-size:12px;">無變化</span>';
}
function hiddenLabel(k){
  return {attention:'關注度', adaptation:'旅外適應性', trust:'戰隊信任度', popularity:'人氣', explosionRate:'心態爆炸率'}[k];
}
function overallRating(){
  let weightedSum=0, weightTotal=0;
  fullStatKeys().forEach(k=>{
    const w = styleWeight(k);
    weightedSum += (S.stats[k]||0)*w;
    weightTotal += w;
  });
  const avgStat = weightTotal>0 ? weightedSum/weightTotal : 0;
  const profs = Object.values(S.proficiency||{});
  const avgProf = profs.length? profs.reduce((a,b)=>a+b,0)/profs.length : 0;
  const powerFactor = bestHeroPowerFactor();
  return clamp((avgStat*0.72 + avgProf*5.6) * powerFactor, 1, 99);
}
function updateWorldRank(){
  const r = overallRating();
  const t = clamp(r/99, 0, 1);
  // 指數（冪次）成長：越接近滿分，排名進步越困難
  // 校準：約 t=0.21 觸及 #250（次級聯賽門檻），t=0.42 觸及 #100（一級聯賽門檻），t=0.54 觸及 #50（頂尖強者），t=1 才觸及 #2
  const curve = Math.pow(1-t, 3);
  S.worldRank = Math.round(clamp(2 + curve*498, 2, 500));
}
function formatMoney(wan){
  wan = Math.max(0, Math.round(wan||0));
  if(wan>=10000){
    const yi = Math.floor(wan/10000);
    const remain = wan%10000;
    return remain>0 ? `${yi}億${remain}萬` : `${yi}億`;
  }
  return `${wan}萬`;
}
function addProfPoints(pool){
  S._profPool = (S._profPool||0)+pool;
}
function pushLog(text){
  S.log.unshift({year:S.year, age:S.age, text});
}
function addFans(n){
  S.fans = Math.max(0, (S.fans||0) + n);
}

function statAllocCost(key, from){
  // cost to raise stat 'key' by 1 given current value 'from'
  const cap = S.statCap[key];
  if(from < cap) return 1;
  const over = from - cap; // 0-based points already over cap
  const table = [2,4,6,8];
  if(over >= table.length) return 16; // beyond cap+4: flat 16 per point, forever (uncapped growth)
  return table[over];
}
function allocCostTotal(k, addPoints){
  let cost=0; let v=S.stats[k];
  for(let i=0;i<addPoints;i++){ cost+=statAllocCost(k,v); v++; }
  return cost;
}
function totalCostSpent(){
  if(!S._alloc) return 0;
  return fullStatKeys().reduce((a,k)=>a + allocCostTotal(k, S._alloc[k]||0), 0);
}
// 自動發放素質點（聯賽獎勵、MSI/世界賽等），一樣尊重天賦上限的加倍花費
function grantStatPoints(pool, targets){
  targets = (targets && targets.length) ? targets : fullStatKeys();
  let remaining = pool;
  const added = {}; targets.forEach(k=>added[k]=0);
  let guard=0;
  while(remaining>0 && guard<800){
    guard++;
    let progressed=false;
    for(const k of targets){
      if(remaining<=0) break;
      const cost = statAllocCost(k, S.stats[k]);
      if(cost===Infinity || cost>remaining) continue;
      S.stats[k] = S.stats[k]+1;
      added[k]++;
      remaining-=cost;
      progressed=true;
    }
    if(!progressed) break;
  }
  return added;
}

function statAllocRow(k){
  if(!S._alloc){ S._alloc = {}; fullStatKeys().forEach(x=>S._alloc[x]=0); }

  const capTag = cur>=cap ? `<span class="muted" style="font-size:10.5px;">0/${nextCost}</span>` : '';

function resolveEvent(mult, chanceMod){
  const ev = S._activeEvent;
  const riskPenalty = (S.hidden.explosionRate-20)/8;
  const chance = clamp(55 + chanceMod - riskPenalty + (S.eventSuccessBonus||0), 8, 92);
  const roll = RNG()*100;
  const success = roll < chance;
  const base = success ? ev.positive : ev.negative;
  const scaled = {};
  const applyable = {};
  for(const k in base.effects){
    const val = base.effects[k];
    if(k==='randomStatBoost'){
      const key = pick(RNG, fullStatKeys());
      const amt = Math.round(val*mult) || (val>0?1:-1);
      scaled[statLabel(key)] = (scaled[statLabel(key)]||0) + amt;
      applyable[key] = (applyable[key]||0) + amt;
      continue;
    }
    if(k==='heroProfBump'){
      const heroes = S.unlocked[S.position]||[];
      if(heroes.length){
        const h = pick(RNG, heroes);
        const cap = heroProfCap(h);
        const amt = Math.round(val*mult) || (val>0?1:-1);
        const before = S.proficiency[h]||0;
        S.proficiency[h] = clamp(before+amt, 0, cap);
        const applied = S.proficiency[h]-before;
        if(applied!==0){ scaled['熟練度：'+h] = applied; }
      }
      continue;
    }
    const amt = Math.round(val*mult) || (val>0?1:-1);
    scaled[k] = (scaled[k]||0)+amt;
    applyable[k] = (applyable[k]||0)+amt;
  }
  applyStatDelta(applyable);
  pushLog(ev.title+'：'+base.desc);
  S._eventResult = {success, desc:base.desc, effects:scaled};
  delete S._activeEvent;
  go('year_event_result');
}

// 單場比賽的細項數據（場次／MVP／傷轉率／參團率／勝率／KDA／五殺）
function genMatchStats(tier, fixedGames){
  const rating = overallRating();
  const s = S.stats;
  const isSupport = S.position==='support';
  const isJungle = S.position==='jungle';
  const games = fixedGames || (rInt(RNG,3,7) + Math.floor(tier.pts/3));
  // 傷害佔比：主要由「操作」決定
  const dmgShare = clamp(Math.round(15 + (s.mechanic-50)*0.55 + rInt(RNG,-4,6)), 6, 55);
  // 經濟佔比：由「吃兵/刷野/跑線」與「經濟/助攻」共同決定
  const econShare = clamp(Math.round(15 + (s.farm-50)*0.32 + (s.fifth-50)*0.32 + rInt(RNG,-4,6)), 8, 36);
  // 傷轉率＝傷害佔比／經濟佔比，可以超過 100%
  const dmgRatio = econShare>0 ? Math.round((dmgShare/econShare)*100) : 100;
  // MVP機率：吃兵/刷野與經濟越高，機率越高，但需要傷轉率夠高來補償經濟佔比帶來的優勢，避免不公平
  const econMvpBoost = Math.max(0,(s.farm-50))/300 + Math.max(0,(s.fifth-50))/300;
  const dmgRatioFactor = clamp(dmgRatio/100, 0.35, 1.6);
  const mvpChance = clamp((tier.pts/16 + econMvpBoost) * dmgRatioFactor, 0, 1);
  const mvp = RNG()<mvpChance ? rInt(RNG,1,Math.max(1,Math.floor(tier.pts/5))) : 0;
  // 參團率：「視野」正相關，「經濟/助攻」負相關；輔助的「跑線」「開團」額外正相關；打野／輔助整體 x1.5
  let participation = 45 + (s.vision-50)*0.5 - (s.fifth-50)*0.35;
  if(isSupport) participation += (s.farm-50)*0.4 + (s.mechanic-50)*0.4;
  if(isSupport || isJungle) participation *= 1.5;
  participation = clamp(Math.round(participation + rInt(RNG,-8,10)), 12, 98);
  const winRate = clamp(rating*0.9+rInt(RNG,-8,8),8,92);
  // KDA：「生存」「操作」「視野」共同決定；輔助的「跑線」「開團」「助攻」額外正相關
  let kdaBase = s.comm*0.4 + s.mechanic*0.35 + s.vision*0.25;
  if(isSupport) kdaBase += s.farm*0.15 + s.fifth*0.15;
  const kda = +clamp(0.8 + kdaBase/40 + RNG()*0.6, 0.3, 14).toFixed(2);
  const penta = (tier.pts>=9 && RNG()<0.3) ? rInt(RNG,0,2) : (RNG()<0.05?1:0);
  return {games, mvp, dmgRatio, participation, winRate, kda, penta};
}
// 比賽獎金：依聯賽等級與名次計算，職業階段才有
function matchPrizeMoney(tier){
  if(S.phase!=='pro' || !S.contract) return 0;
  const base = LEAGUE_SALARY_BASE[S.contract.league] || 30;

function currentAffiliation(){

function recordMatch(label, tier, fixedGames){
  const gm = genMatchStats(tier, fixedGames);
  if(!S._yearMatches) S._yearMatches = [];
  S._yearMatches.push({label, tierName:tier.name, pts:tier.pts, ...gm});
  S._seasonPointPool = (S._seasonPointPool||0) + tier.pts;

    S._seasonEarnings = (S._seasonEarnings||0) + prize;

  }
  if(!S.careerAgg) S.careerAgg = {games:0, winRateWeighted:0, kdaWeighted:0, dmgRatioWeighted:0, participationWeighted:0, penta:0};
  S.careerAgg.games += gm.games;
  S.careerAgg.winRateWeighted += gm.winRate*gm.games;
  S.careerAgg.kdaWeighted += gm.kda*gm.games;
  S.careerAgg.dmgRatioWeighted += gm.dmgRatio*gm.games;
  S.careerAgg.participationWeighted += gm.participation*gm.games;
  S.careerAgg.penta += gm.penta;
  if(!S.careerNotableMatches) S.careerNotableMatches = [];
  if(TOP4_TIER_IDS.includes(tier.id)){
    S.careerNotableMatches.push({label, tierName:tier.name, pts:tier.pts, year:S.year, team:currentAffiliation()});
  }

}
function runLeague(key){

function pick2(rng, arr, n){
  const copy=[...arr]; const out=[];
  for(let i=0;i<n && copy.length;i++){ const idx=Math.floor(rng()*copy.length); out.push(copy.splice(idx,1)[0]); }
  return out;
}

function diceAlloc(k,dir){

function weightedPick(weights){
  const entries = Object.entries(weights).filter(([k,w])=>w>0);
  if(!entries.length) return null;
  const total = entries.reduce((a,[,w])=>a+w,0);
  let r = RNG()*total;
  for(const [k,w] of entries){ if(r<w) return k; r-=w; }
  return entries[entries.length-1][0];
}
// 青訓合約僅限 LDL / LCP / LCS / PCS，權重 LDL=LCP>LCS>PCS
// 聯賽戰力門檻：世界排名達 100 才能拿 LPL 合約，達 250 才能拿 LDL／LCS／LCP 合約或升隊；PCS 不設門檻
const RANK_LPL_MAX = 100;
const RANK_SECOND_TIER_MAX = 250;
function academyLeagueWeights(){
  const rating = overallRating();
  const w = {LDL:30, LCP:30, LCS:18, PCS:22};
  if(rating>70){ w.LCS+=14; w.PCS-=14; }
  else if(rating<35){ w.PCS+=14; w.LCS-=10; }
  // 新秀青訓合約：LDL／PCS 永遠開放（保底），LCP／LCS 需世界排名達 250 內
  if(S.worldRank > RANK_SECOND_TIER_MAX){ w.LCP = 0; w.LCS = 0; }
  // 世界排名前 100 時，次級聯賽（LDL／PCS）已經配不上你了
  if(S.worldRank <= RANK_LPL_MAX){ w.LDL = 0; w.PCS = 0; }
  return w;
}
// 世界排名越高，報價年薪倍率越高
function rankSalaryMultiplier(){
  if(!S.worldRank || S.phase!=='pro') return 1;
  const t = clamp((500-S.worldRank)/498, 0, 1);
  return 0.8 + t*0.9;
}
// 依聯賽等級、球隊實力、合約類型、世界排名計算年薪（萬）
function offerSalary(league, team, type){
  const base = LEAGUE_SALARY_BASE[league] || 60;
  const strengthPct = TEAM_STRENGTH[team];
  const strengthMult = strengthPct!==undefined ? (1 + strengthPct/100) : 1;
  const typeMult = type==='long' ? 0.9 : (type==='short' ? 1.05 : 0.7);
  return Math.round(base * strengthMult * typeMult * rankSalaryMultiplier());
}
function generateAcademyOffers(n){
  const offers=[]; const usedTeams=new Set(); let guard=0;
  while(offers.length<n && guard<60){
    guard++;
    const league = weightedPick(academyLeagueWeights());
    if(!league) break;
    const teams = PRO_LEAGUES[league].teams.filter(t=>!usedTeams.has(t));
    if(teams.length===0) continue;
    const team = pick(RNG, teams);
    usedTeams.add(team);
    offers.push({league, team, type:'academy', years:1, salary:offerSalary(league,team,'academy')});
  }
  return offers;
}
function teamStrengthTag(team){
  const pct = TEAM_STRENGTH[team];
  return pct!==undefined ? `<span class="tag teal">世界賽奪冠機率 ${pct}%</span>` : '';

function msiWorldsEligible(tierId){
  const league = S.contract.league;
  if(!['LCP','LCS','LPL'].includes(league)) return false;
  if(league==='LPL') return ['r6','r9','r12','r16'].includes(tierId); // 四強以上
  return ['r12','r16'].includes(tierId); // 冠軍或亞軍
}
// MSI/世界賽名次機率：完全依合約上寫的球隊實力(TEAM_STRENGTH)，與玩家自身強度無關
// LCP/LCS：至少 80% 機率止步八強／小組淘汰；LPL：至少 63%
function simulateIntlPlacement(){
  const league = S.contract.league;
  const qfFloor = league==='LPL' ? 0.63 : 0.80;
  const champProb = Math.min((TEAM_STRENGTH[S.contract.team]||8)/100, Math.max(0, 1-qfFloor-0.02));
  const remainder = Math.max(0, 1 - qfFloor - champProb);
  const sfProb = remainder*0.45;
  const i3Prob = remainder*0.30;
  const i2Prob = remainder*0.25;
  const roll = RNG();
  let acc = qfFloor;
  if(roll < acc) return INTL_TIERS.find(t=>t.id==='qf');
  acc += sfProb;
  if(roll < acc) return INTL_TIERS.find(t=>t.id==='sf');
  acc += i3Prob;
  if(roll < acc) return INTL_TIERS.find(t=>t.id==='i3');
  acc += i2Prob;
  if(roll < acc) return INTL_TIERS.find(t=>t.id==='i2');
  return INTL_TIERS.find(t=>t.id==='i1');
}

function finalizeProYear(){
  const springPts = S._springTier ? S._springTier.pts : 0;
  const postPts = S._postTier ? S._postTier.pts : 0;
  const avgPts = (springPts+postPts)/2 || 2;
  const baseSalary = S.contract.salary || (LEAGUE_SALARY_BASE[S.contract.league]||60);
  let mult = 0.7 + (avgPts/16)*0.6;
  let salaryGain = Math.round(baseSalary*mult);
  if(S._attendedMSI) salaryGain += Math.round(baseSalary*0.15);
  if(S._attendedWorlds) salaryGain += Math.round(baseSalary*0.25);
  S.careerSalary = (S.careerSalary||0) + salaryGain;
  S._seasonEarnings = (S._seasonEarnings||0) + salaryGain;
  S.contract.yearsElapsed = (S.contract.yearsElapsed||0)+1;
  if(!S._recentTiers) S._recentTiers = [];
  const repTier = (S._postTier || S._springTier || TIERS[0]).id;
  S._recentTiers.push(repTier);
  if(S._recentTiers.length>2) S._recentTiers.shift();
  pushLog(S.contract.team+' '+S.year+' 年賽季結束，年薪 '+salaryGain+' 萬');
  updateWorldRank();
  delete S._springTier; delete S._postTier; delete S._msiEligible; delete S._worldsEligible;
  delete S._attendedMSI; delete S._attendedWorlds;
  go('year_matches_overview');
}


/* ===================== 合約與退役判定 ===================== */
function maybeTradeOrDemote(){
  if(!S._recentTiers || S._recentTiers.length<2) return;
  const bothBad = S._recentTiers.every(id=>id==='r2'||id==='r4');
  const stagnant = S.careerHistory.length>=2 &&
    S.careerHistory[S.careerHistory.length-1].rank >= S.careerHistory[S.careerHistory.length-2].rank - 3;
  if((bothBad || stagnant) && S.hidden.trust<45){
    const pairedDown = TEAM_PAIR_DOWN[S.contract.team];
    const reason = bothBad ? '成績低迷' : '進步幅度太小';
    if(pairedDown){
      pushLog(reason+'，你被下放至 '+PRO_LEAGUES[pairedDown.league].name+' 的 '+pairedDown.team+'（原隊二軍）');
      S.contract.league = pairedDown.league; S.contract.team = pairedDown.team;
    } else {
      const demoteMap = {LPL:'LDL', LCP:'PCS'};
      if(demoteMap[S.contract.league] && RNG()<0.5){
        const newLeague = demoteMap[S.contract.league];
        const newTeam = pick(RNG, PRO_LEAGUES[newLeague].teams);
        pushLog(reason+'，你被下放至 '+PRO_LEAGUES[newLeague].name+' 的 '+newTeam);
        S.contract.league = newLeague; S.contract.team = newTeam;
      } else {
        const pool = PRO_LEAGUES[S.contract.league].teams.filter(t=>t!==S.contract.team);
        const newTeam = pick(RNG, pool);
        pushLog(reason+'，你被轉讓至 '+newTeam);
        S.contract.team = newTeam;
      }
    }
    S.contract.salary = offerSalary(S.contract.league, S.contract.team, S.contract.type);
    S.hidden.trust = 45;
    S._recentTiers = [];
  }
}
// 青訓合約到期：世界排名達 250 內才能轉正職業，否則被交易到別的青訓隊繼續跑青訓內容
function handleAcademyExpiry(){
  if((S._lastAcademyWinRate!==undefined) && S._lastAcademyWinRate<50){
    pushLog('青訓成績不佳（勝率 '+S._lastAcademyWinRate.toFixed(0)+'%），被隊伍退回，需重新尋找青訓機會');
    delete S._lastAcademyWinRate;
    S.contract = null;
    go('pro_signing');
    return;
  }
  delete S._lastAcademyWinRate;
  if(S.worldRank <= RANK_SECOND_TIER_MAX){
    pushLog('世界排名達標，準備轉為正式職業合約');
    delete S._renewalOffer; delete S._renewalChecked;
    go('contract_decision');
    return;
  }
  const league = weightedPick(academyLeagueWeights()) || 'LDL';
  const pool = PRO_LEAGUES[league].teams.filter(t=>t!==S.contract.team);
  const team = pick(RNG, pool.length?pool:PRO_LEAGUES[league].teams);
  const salary = offerSalary(league, team, 'academy');
  pushLog('世界排名尚未達標（#'+S.worldRank+'），被交易到 '+team+'（'+PRO_LEAGUES[league].name+'），繼續青訓生活');
  S.contract = {league, team, type:'academy', yearsTotal:1, yearsRemaining:1, yearsElapsed:0, salary};
  advanceProYear();
}
function checkContractAndRetirement(){
  maybeTradeOrDemote();
  const rating = overallRating();
  const declining = S.careerHistory.length>=2 &&
    S.careerHistory[S.careerHistory.length-1].rank > S.careerHistory[S.careerHistory.length-2].rank + 15;
  const tooOld = S.age >= 30;
  const badForm = rating < 22;
  if((tooOld && rating<45) || (declining && S.hidden.trust<25) || (badForm && S.age>22)){
    go('retire'); return;
  }
  S.contract.yearsRemaining = (S.contract.yearsRemaining||1) - 1;
  if(S.contract.yearsRemaining <= 0){
    if(S.contract.type==='academy'){ handleAcademyExpiry(); return; }
    delete S._renewalOffer; delete S._renewalChecked;
    go('contract_decision'); return;
  }
  advanceProYear();
}

  if(bestRank<=30) return '世界頂尖選手';
  if(bestRank<=80) return '職業明星選手';
  if(bestRank<=200) return '一線職業選手';
  return '次級聯賽選手';
}

function downloadCareerCSV(){
  const rows = [['年份','年齡','遊戲場次','勝率(%)','KDA','參團率(%)','傷害轉換率(%)','MVP次數']];
  (S.yearlyRecords||[]).forEach(r=>{
    rows.push([r.year, r.age, r.games, r.winRate, r.kda, r.participation, r.dmgRatio, r.mvp]);
  });
  const csv = '\uFEFF'+rows.map(row=>row.join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = (S.id||'career')+'_生涯逐年數據.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function restartGame(){
  const seed = genRandomSeed();
  S = newState(seed);
  RNG = makeRng(seed);
  render();
}

  ctx.fillText('世界種子：'+S.seed, 50, canvas.height-40);
  ctx.textAlign = 'right';
  ctx.fillText('RIFT RISING · v1.6.0', canvas.width-50, canvas.height-40);
  ctx.textAlign = 'left';

  return canvas;
}
function downloadCareerCard(){
  const canvas = drawCareerCard();
  canvas.toBlob(function(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (S.id||'career')+'_生涯卡片.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  });
}

        <div class="kv"><span class="k">粉絲數</span><span class="v">${(S.fans||0).toLocaleString()}</span></div>
        <div class="kv"><span class="k">心態爆炸率</span><span class="v" style="color:${S.hidden.explosionRate>=50?'var(--red)':(S.hidden.explosionRate>=25?'var(--gold)':'var(--teal)')};">${S.hidden.explosionRate}%</span></div>
        ${S.phase==='pro' && S.contract ? `<div class="kv"><span class="k">合約狀態</span><span class="v">${S.contract.team} 剩餘 ${S.contract.yearsRemaining} 年</span></div>` : ''}
        ${S.titles && S.titles.length ? `<div class="kv"><span class="k">稱號</span><span class="v">${S.titles.map(id=>`<span class="tag" title="${TITLE_META[id].desc}" style="color:${TITLE_META[id].color}; border-color:${TITLE_META[id].color};">${TITLE_META[id].name}</span>`).join(' ')}</span></div>` : ''}
      </div>
    </div>
    ${renderArchetypePanel()}
  </div>`;
}
function renderArchetypePanel(){
  const list = POSITION_ARCHETYPES[S.position]||[];
  if(!S.position || !list.length || !S.stats) return '';
  return `<div class="divider"></div>
  <div class="kv"><span class="k">定位素質</span><span class="v"></span></div>
  <div class="statgrid">
    ${list.map(name=>{
      const v = S.stats[name]||0;
      return `<div class="statline" style="grid-column:span 2;"><span class="name">${name}</span><div class="bar"><i style="width:${Math.min(100,v)}%;"></i></div><span class="num">${v}</span></div>`;
    }).join('')}
  </div>`;
}
function drawRadar(){
  const svg = document.getElementById('radarSvg');
  if(!svg) return;
  const cx=75, cy=75, r=58;
  const keys = STAT_KEYS;
  const n = keys.length;
  let poly = '', spokes='', labels='';
  const pts = keys.map((k,i)=>{
    const ang = -Math.PI/2 + i*(2*Math.PI/n);
    const val = clamp((S.stats[k]||0)/99,0,1);
    const x = cx + Math.cos(ang)*r*val;
    const y = cy + Math.sin(ang)*r*val;
    const lx = cx + Math.cos(ang)*(r+14);
    const ly = cy + Math.sin(ang)*(r+14);
    labels += `<text x="${lx}" y="${ly}" font-size="8" fill="#8891a3" text-anchor="middle" dominant-baseline="middle">${statLabel(k)}</text>`;
    spokes += `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(ang)*r}" y2="${cy+Math.sin(ang)*r}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    return x+','+y;
  });
  poly = pts.join(' ');
  let rings='';
  [0.33,0.66,1].forEach(f=>{
    const rp = keys.map((k,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      return (cx+Math.cos(ang)*r*f)+','+(cy+Math.sin(ang)*r*f);
    }).join(' ');
    rings += `<polygon points="${rp}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
  });
  svg.innerHTML = rings + spokes + `<polygon points="${poly}" fill="rgba(212,175,106,0.22)" stroke="#d4af6a" stroke-width="1.5"/>` + labels;
}
